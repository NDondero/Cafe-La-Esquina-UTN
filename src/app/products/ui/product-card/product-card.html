@let product = this.product();

<article>
  <p [style.color]="'var(--color-accent)'">{{ product.category }}</p>
  <h2>{{ product.name }}</h2>
  <p [style.color]="'var(--text-secondary)'" class="description">{{ product.description }}</p>
  <p [style.color]="'var(--color-accent)'">$ {{ product.price }}</p>
  <div class="buttons">
    <button (click)="navigationSelected.emit(product.id)">Ver detalles</button>
    <button (click)="productDeleted.emit(product.id)">Borrar</button>
  </div>
</article>
