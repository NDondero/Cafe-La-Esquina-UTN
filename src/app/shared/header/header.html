<h2>La Esquina</h2>
<nav>
  <a
    [routerLink]="commands.products"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    Productos
  </a>
  <a [routerLink]="commands.addProduct" routerLinkActive="active-link">Agregar productos</a>
</nav>
@if (auth.isAuthenticated()) {
  <button (click)="logout()">Cerrar Sesión</button>
} @else {
  <button [routerLink]="commands.login">Iniciar sesión</button>
}
